name: Publish cluster-microservices image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (manual test publish; not marked latest)'
        required: true
        default: 'dev'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: generacy-ai/cluster-microservices

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      image: ${{ steps.ver.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer/generacy
          file: .devcontainer/generacy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ github.event_name == 'push' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Generacy cluster-microservices development image — orchestrator + workers + Docker-in-Docker for app stacks.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify credhelper uid (must be 1002)
        run: |
          set -euo pipefail
          IMAGE="${{ needs.build.outputs.image }}"
          echo "Smoke-testing ${IMAGE}"
          docker pull "${IMAGE}"
          OUTPUT=$(docker run --rm "${IMAGE}" id credhelper)
          echo "${OUTPUT}"
          echo "${OUTPUT}" | grep -Eq '\buid=1002\b'

      - name: Verify DinD startup
        run: |
          set -euo pipefail
          IMAGE="${{ needs.build.outputs.image }}"
          echo "DinD smoke-test ${IMAGE}"
          docker run --privileged --rm \
            -e ENABLE_DIND=true \
            "${IMAGE}" \
            bash -lc "/usr/local/bin/setup-docker-dind.sh && docker info"
